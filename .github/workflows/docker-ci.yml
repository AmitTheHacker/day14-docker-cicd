name: docker-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/winter-arc-app

jobs:
  # BONUS CHALLENGE PART 1: Isolated initial static verification gate
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting and Application Core Tools
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Execute Static Mock Compile Test
        run: |
          # Verify that python script compiling contains zero structural syntax issues
          python -m py_compile app.py

  build-test-scan:
    needs: run-unit-tests # Sequential gate ensuring test execution succeeds first
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Source
        uses: actions/checkout@v4

      - name: Set up Advanced Buildx Component
        uses: docker/setup-buildx-action@v3

      - name: Compile and Build Temporary Image Artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Image via Trivy Security Gate
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Authenticate Ingress directly to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BONUS CHALLENGE PART 2: Deliver both audit-safe SHA tags and version aliases
      - name: Push Secure Dual Representations to Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Push the unique cryptographic SHA tag for precise code trace auditing
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Assign a semantic production version alias and publish to container store
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:v1.0.0
          docker push ${{ env.IMAGE_NAME }}:v1.0.0
